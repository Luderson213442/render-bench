name: motion
run-name: ${{ inputs.job }}
# Fatias de um motion em paralelo. O pacote vem do armazenamento privado e o vídeo volta para lá;
# o log não mostra arquivos nem conteúdo, e a execução é apagada pelo PC ao terminar.
on:
  workflow_dispatch:
    inputs:
      job:
        description: id da tarefa
        required: true
      fatias:
        description: 'JSON [[ini,fim],...]'
        required: true
permissions: {}
jobs:
  f:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      max-parallel: 20
      matrix:
        r: ${{ fromJSON(inputs.fatias) }}
    env:
      JOB: ${{ inputs.job }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: motion
          sparse-checkout-cone-mode: false
      - name: Preparar
        run: |
          t=$(date +%s)
          (npm i -s --no-save --prefix /tmp/pw playwright-core@1.58.0 > /dev/null 2>&1) &
          pip install -q boto3 imageio-ffmpeg > /dev/null 2>&1
          wait
          ln -s /tmp/pw/node_modules motion/node_modules
          python motion/r2.py baixar
          echo "preparo $(( $(date +%s) - t )) s"
      - name: Render
        run: |
          export CHROME=$(command -v google-chrome) FFMPEG=$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          node motion/fatia.mjs "$(cat /tmp/job/html.txt)" ${{ matrix.r[0] }} ${{ matrix.r[1] }} /tmp/out.mp4 /tmp/out.json 4 0 > /tmp/log.txt 2>&1 || { grep -iE "erro|error" /tmp/log.txt | sed 's#/tmp/job[^ ]*#…#g' | head -5; exit 1; }
          tail -1 /tmp/log.txt
      - name: Saída
        run: python motion/r2.py enviar ${{ matrix.r[0] }}
      - name: Limpar
        if: always()
        run: rm -rf /tmp/job /tmp/out.* /tmp/log.txt; echo ok
